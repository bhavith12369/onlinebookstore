<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Aurora Bookstore</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">Aurora Bookstore</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="cart.html" class="cart-icon">
                Cart
                <span class="cart-count" id="cart-count" style="display:none;">0</span>
            </a>
            <span id="auth-link"></span>
        </div>
    </nav>

    <main style="display: flex; justify-content: center; align-items: center; text-align: center; height: 60vh;">
        <div class="auth-container">
            <h1 style="color: var(--accent-color); margin-bottom: 1rem;">Order Confirmed!</h1>
            <p style="color: var(--text-secondary); margin-bottom: 2rem;">Thank you for your purchase. Your books will be shipped soon.</p>
            <a href="index.html" class="btn">Continue Shopping</a>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
